<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swing Setups</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
<style>
  :root {
    --bg: #fafaf9; --card: #ffffff; --text: #1c1917; --muted: #78716c; --line: #e7e5e4;
    --green: #15803d; --red: #b91c1c; --blue: #1d4ed8; --amber: #b45309; --soft: #f5f5f4;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0c0a09; --card: #1c1917; --text: #fafaf9; --muted: #a8a29e; --line: #292524;
            --green: #4ade80; --red: #f87171; --blue: #93c5fd; --amber: #fbbf24; --soft: #292524; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 48px 16px 64px; text-align: center; }
  .narrow { max-width: 620px; margin: 0 auto; }
  /* heat map */
  :root { --h-lo: #c9372c; --h-mid: #e7e5e4; --h-hi: #1f8a3c; }
  @media (prefers-color-scheme: dark) { :root { --h-lo: #c9372c; --h-mid: #3a3633; --h-hi: #23a047; } }
  .heat { margin-top: 30px; text-align: left; }
  .heat-head { display: flex; justify-content: space-between; align-items: end; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .heat-head h2 { font-size: 17px; margin: 0; }
  .scale { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .scale i { display: block; width: 160px; height: 8px; border-radius: 8px; background: linear-gradient(90deg, var(--h-lo), var(--h-mid), var(--h-hi)); }
  .sector { margin: 14px 0 0; }
  .sector h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 3px; }
  .tile { border: 0; border-radius: 6px; padding: 8px 4px 7px; text-align: center; cursor: pointer; font: inherit; line-height: 1.25; }
  .tile b { display: block; font-size: 14px; }
  .tile span { font-size: 12px; opacity: .85; }
  .tile.sel { outline: 2px solid var(--text); outline-offset: 1px; }
  #tip { max-width: 620px; margin: 14px auto 0; }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 18px 0 6px; }
  .kpis div { background: var(--soft); border-radius: 10px; padding: 10px 4px; }
  .kpis b { display: block; font-size: 18px; }
  .kpis small { color: var(--muted); font-size: 12px; }
  .seg { display: inline-flex; background: var(--soft); border-radius: 10px; padding: 3px; margin-top: 12px; }
  .seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 8px; font-size: 13px; }
  .seg button.on { background: var(--card); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td, th { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: right; }
  th { color: var(--muted); font-weight: 500; }
  td:first-child, th:first-child { text-align: left; }
  svg.curve { width: 100%; height: 120px; display: block; margin-top: 10px; }
  .rs-chart { position: relative; margin-top: 12px; }
  .rs-chart svg { width: 100%; height: 190px; display: block; }
  .rs-tip { position: absolute; top: 0; pointer-events: none; background: var(--card); border: 1px solid var(--line);
            border-radius: 8px; padding: 6px 8px; font-size: 12px; text-align: left; white-space: nowrap; display: none; }
  .keys { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .keys i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; margin-top: 8px; }
  .chips span { background: var(--soft); border-radius: 6px; padding: 2px 6px; font-size: 12px; }
  @media (max-width: 480px) { #research td, #research th { font-size: 11px; padding: 5px 2px; } }
  .ok { color: var(--green); } .no { color: var(--red); }
  h1 { font-size: 28px; margin: 0 0 4px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); font-size: 13px; }
  .chip { display: inline-block; padding: 3px 10px; border-radius: 999px; background: var(--soft); font-size: 13px; margin: 14px 4px 0; }
  button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--text);
           border-radius: 10px; padding: 9px 18px; }
  button.primary { background: var(--text); color: var(--bg); border-color: var(--text); margin-top: 22px; }
  button:disabled { opacity: .5; cursor: default; }
  #log { color: var(--muted); font-size: 13px; min-height: 20px; margin-top: 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 26px 22px; margin-top: 28px; text-align: center; }
  .label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .sym { font-size: 44px; font-weight: 700; letter-spacing: -0.03em; margin: 2px 0 0; }
  .name { color: var(--muted); font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 22px 0 6px; }
  .grid div { background: var(--soft); border-radius: 10px; padding: 10px 4px; }
  .grid b { display: block; font-size: 17px; }
  .grid small { color: var(--muted); font-size: 12px; }
  .stats { display: flex; justify-content: center; gap: 22px; flex-wrap: wrap; margin: 18px 0 4px; font-size: 14px; }
  .bar { display: flex; height: 8px; border-radius: 99px; overflow: hidden; margin: 14px auto 4px; max-width: 360px; background: var(--soft); }
  .bar span:nth-child(1) { background: var(--green); } .bar span:nth-child(2) { background: var(--muted); } .bar span:nth-child(3) { background: var(--red); }
  .legend { font-size: 12px; color: var(--muted); }
  .score { margin-top: 16px; font-size: 13px; color: var(--muted); }
  .section { text-align: left; margin-top: 22px; }
  .section h3 { font-size: 13px; margin: 0 0 6px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
  .section ul { margin: 0; padding-left: 20px; }
  .section p { margin: 0; }
  details { text-align: left; margin-top: 18px; border-top: 1px solid var(--line); padding-top: 12px; }
  summary { cursor: pointer; color: var(--muted); font-size: 13px; text-align: center; list-style: none; }
  .row { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; text-align: left; }
  .row:last-child { border-bottom: 0; }
  .meter { display: grid; grid-template-columns: 110px 1fr 34px; gap: 8px; align-items: center; font-size: 13px; margin: 4px 0; }
  .meter i { display: block; height: 6px; border-radius: 6px; background: var(--blue); }
  .meter em { display: block; background: var(--soft); border-radius: 6px; }
  .pos { color: var(--green); } .neg { color: var(--red); }
  .empty { font-size: 40px; margin-bottom: 6px; }
  footer { color: var(--muted); font-size: 12px; margin-top: 40px; }
  @media (max-width: 480px) { .kpis { grid-template-columns: repeat(2, 1fr); } .tiles { grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); } .grid { grid-template-columns: repeat(2, 1fr); } .sym { font-size: 36px; } }
</style>
</head>
<body>
<main>
  <h1>📈 Swing Setups</h1>
  <div class="sub" id="asof">Rules find it · 🧠 LLMs judge it · you decide</div>
  <div id="chips"></div>
  <button class="primary" id="scan">🔍 Run scan</button>
  <div id="log"></div>
  <section class="heat" id="heat"></section>
  <div class="narrow"><div id="active"></div><div id="out"></div><div id="research"></div><div id="dips"></div></div>
  <footer>Research tool, not financial advice. Backtests include only stocks listed today (survivorship bias); probabilities on pick cards are haircut 30%.</footer>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct = x => x == null ? "–" : `${Math.round(x * 100)}%`;
const sgn = x => x == null ? "–" : (x > 0 ? "+" : "") + x;
const money = x => x == null ? "–" : `$${Number(x).toFixed(2)}`;
const REG = {"Risk-On": "🟢", "Neutral": "🟡", "Risk-Off": "🔴"};
const SETUP = {A: "📦 Base Breakout", B: "🪜 Pullback in Uptrend", C: "📣 Post-Earnings Drift", D: "🛒 Buy the Dip"};
const AGENT = {technical: "📊 Technical", fundamental: "🧾 Fundamental", news: "📰 News", positioning: "🐋 Positioning"};
const BUCKET = {momentum: "🚀 Momentum", rs: "💪 Rel. strength", setup: "📐 Setup quality", volume: "🔊 Volume",
                fundamental: "🧾 Fundamentals", positioning: "🐋 Positioning"};

function ruleReasons(p) {
  const d = p.digest || {}, m = d.setup_metrics || {}, r = (d.factors || {}).ranks_0_100 || {}, f = d.fundamentals || {};
  const out = [];
  if (p.setup === "A") out.push(`Broke out of a ${m.base_len_days}-day base (depth ${pct(m.base_depth)}) on ${m.breakout_rvol}× normal volume`);
  if (p.setup === "B") out.push(`Bounced off a ${pct(m.pullback_from_20d_high)} pullback on light volume (${m.pullback_volume_ratio}× avg)`);
  if (p.setup === "D") out.push(`Dipped ${pct(m.dip_from_20d_high)} from its 20-day high with RSI(2) at ${Number(m.rsi2).toFixed(1)}, while ${Number(m.dist_above_sma200_atr).toFixed(1)} ATR above a rising 200-day`);
  if (p.setup === "C") out.push(`Holding a ${m.gap_atr}-ATR earnings gap from ${m.gap_date} (${m.gap_rvol}× volume)`);
  if (r.rs_raw != null) out.push(`Relative strength beats ${r.rs_raw}% of the universe; 12-1 momentum rank ${r.mom_12_1}`);
  if (f.surprise_pct != null) out.push(`Last EPS surprise ${pct(f.surprise_pct)}${f.rev_yoy != null ? `, revenue ${sgn(Math.round(f.rev_yoy*100))}% YoY` : ""}`);
  if (f.insider_buyers) out.push(`${f.insider_buyers} insider buyer(s) in the last 90 days`);
  return out;
}

function meters(b) {
  return Object.entries(b || {}).map(([k, v]) =>
    `<div class="meter"><span>${BUCKET[k] || k}</span><em><i style="width:${Math.max(2, v || 0)}%"></i></em><b>${v ?? "–"}</b></div>`).join("");
}

function pickCard(p, top) {
  const c = p.llm_card;
  const reasons = c ? c.key_points : ruleReasons(p);
  const risks = c ? c.risks : (p.l2 ? p.l2.objections.map(o => o.objection) : []);
  const win = p.p_win * 100, to = p.p_timeout * 100, loss = Math.max(0, 100 - win - to);
  const l1 = Object.entries(p.l1 || {}).map(([a, r]) =>
    `<div class="row"><span>${AGENT[a]}</span><span>${sgn(r.stance)} · ${pct(r.confidence)}</span></div>
     ${r.summary ? `<div class="sub" style="text-align:left;margin:-4px 0 6px">${esc(r.summary)}</div>` : ""}`).join("");
  const l2 = p.l2 ? p.l2.objections.map((o, i) => {
      const v = (p.l2.rulings.find(r => r.objection_index === i) || {}).verdict || "–";
      return `<div class="row"><span>🐻 ${esc(o.objection)}</span><span>${{refuted:"✅",partially_refuted:"➖",stands:"⚠️"}[v] || ""} ${v.replace("_"," ")}</span></div>`;
    }).join("") : "";
  return `<div class="card">
    <div class="label">${top ? "🎯 Top pick" : "Pick"} · ${SETUP[p.setup]}</div>
    <div class="sym">${esc(p.symbol)}</div>
    <div class="name">${esc(p.name || "")}${p.sector ? " · " + esc(p.sector) : ""}</div>
    <div class="grid">
      <div><small>🟢 Buy</small><b>${money(p.entry)}</b><small>max ${money(p.max_entry)}</small></div>
      <div><small>🛑 Stop</small><b>${money(p.stop)}</b><small class="neg">−${p.risk_pct}%</small></div>
      <div><small>🎯 Target 1</small><b>${money(p.t1)}</b><small class="pos">+${p.t1_pct}% · ${p.rr}R</small></div>
      <div><small>🚀 Target 2</small><b>${money(p.t2)}</b><small class="pos">+${p.t2_pct}%</small></div>
    </div>
    <div class="bar"><span style="width:${win}%"></span><span style="width:${to}%"></span><span style="width:${loss}%"></span></div>
    <div class="legend">✅ ${pct(p.p_win)} hit T1 · ⏳ ${pct(p.p_timeout)} time stop · ❌ ${pct(p.p_loss)} stopped · random entry = ${pct(p.baseline)}</div>
    <div class="stats">
      <span>⏱️ ~${p.days} days <span class="sub">(${p.days_range ? p.days_range.join("–") : "–"})</span></span>
      <span>💰 EV ${sgn(p.ev_r)}R <span class="sub">(${sgn(p.ev_pct)}%)</span></span>
      <span>⌛ exit by day ${p.time_stop}</span>
    </div>
    <div class="score">Quant ${p.quant} · 🧠 ${sgn(p.l1_adj)} · ⚔️ ${sgn(p.l2_penalty)} · ⚖️ ${sgn(p.l3_adj)} = <b>${p.final}</b></div>
    ${c ? `<div class="section"><h3>💡 Thesis</h3><p>${esc(c.thesis)}</p></div>` : ""}
    <div class="section"><h3>📌 Why</h3><ul>${(reasons || []).map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>
    ${risks && risks.length ? `<div class="section"><h3>⚠️ Risks</h3><ul>${risks.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
    ${c ? `<div class="section"><h3>🚪 Invalidation</h3><p>${esc(c.invalidation)}</p></div>` : ""}
    <details><summary>🔬 Details</summary>
      <div class="section"><h3>Factor scores</h3>${meters(p.buckets)}</div>
      ${l1 ? `<div class="section"><h3>🧠 Specialists</h3>${l1}</div>` : ""}
      ${l2 ? `<div class="section"><h3>⚔️ Bull vs bear</h3>${l2}</div>` : ""}
      <div class="section"><h3>📊 Probability source</h3><p class="sub">${esc(p.prob_source)}</p></div>
      <div style="text-align:center;margin-top:16px"><button onclick='paper(${JSON.stringify({symbol:p.symbol,entry:p.entry,stop:p.stop,t1:p.t1})})'>📝 Paper trade (1% risk)</button></div>
    </details>
  </div>`;
}

function render(r) {
  if (!r || r.empty) { $("#out").innerHTML = `<div class="card"><div class="empty">👋</div>No scan yet. Run one after the close.</div>`; return; }
  const g = r.regime;
  $("#asof").textContent = `Data as of ${r.asof} · ${r.universe} stocks · ${r.n_setups} setups`;
  $("#chips").innerHTML = `<span class="chip">${REG[g.state]} ${g.state} ${g.score}/10</span>
    <span class="chip">📊 breadth ${g.breadth_pct}%</span><span class="chip">😨 VIX ${g.vix ?? "–"}</span>
    <span class="chip">${r.llm ? "🧠 LLM on" : "🧠 LLM off"}</span>${r.backtest.available ? "" : `<span class="chip">⚠️ no backtest</span>`}`;
  let html = r.picks.length ? r.picks.map((p, i) => pickCard(p, i === 0)).join("")
    : `<div class="card"><div class="empty">💤</div><b>No trade today</b>
       <p class="sub">${esc((r.judge && r.judge.no_trade_reason) || `Nothing cleared the ${g.state} bar of ${r.threshold}.`)}</p></div>`;
  if (r.runners_up.length) html += `<div class="card"><div class="label">👀 Runners-up</div>${r.runners_up.map(p =>
      `<div class="row"><span><b>${esc(p.symbol)}</b> <span class="sub">${SETUP[p.setup]}</span></span>
       <span>${p.final} · ${pct(p.p_win)} · ${sgn(p.ev_r)}R${p.veto ? " · 🚫" : ""}</span></div>`).join("")}</div>`;
  $("#out").innerHTML = html;
}

// ---------- heat map ----------
function hex2rgb(h) { h = h.trim().replace("#", ""); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); }
function heatColor(v) {
  const cs = getComputedStyle(document.documentElement);
  const [lo, mid, hi] = ["--h-lo", "--h-mid", "--h-hi"].map(k => hex2rgb(cs.getPropertyValue(k)));
  const t = Math.max(0, Math.min(100, v)) / 100;
  const [a, b, u] = t < .5 ? [lo, mid, t / .5] : [mid, hi, (t - .5) / .5];
  const rgb = a.map((x, i) => Math.round(x + (b[i] - x) * u));
  const lum = (0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2]) / 255;
  return {bg: `rgb(${rgb})`, fg: lum > 0.55 ? "#1c1917" : "#ffffff"};
}
let HEAT = null;
function renderHeat(h) {
  HEAT = h;
  if (!h || h.empty) { $("#heat").innerHTML = ""; return; }
  const by = {};
  h.tiles.forEach(t => (by[t.sector] = by[t.sector] || []).push(t));
  const sectors = Object.entries(by).map(([k, v]) => [k, v.sort((a, b) => b.rating - a.rating),
    v.reduce((s, t) => s + t.rating, 0) / v.length]).sort((a, b) => b[2] - a[2]);
  const nSig = h.tiles.filter(t => t.signal).length;
  $("#heat").innerHTML = `<div class="heat-head"><div><h2>🗺️ Dip-buy heat map</h2>
      <div class="sub">${h.n} most-traded stocks · ${h.asof} · 🛒 ${nSig} meet every dip rule</div></div>
      <div class="scale">Avoid <i></i> Best dip buy</div></div>
    ${sectors.map(([name, tiles, avg]) => `<div class="sector"><h4>${esc(name)} · avg ${Math.round(avg)}</h4><div class="tiles">
      ${tiles.map(t => { const c = heatColor(t.rating);
        return `<button class="tile" data-s="${esc(t.symbol)}" style="background:${c.bg};color:${c.fg}"
          title="${esc(t.name)} · rating ${t.rating} · ${(t.chg_1d * 100).toFixed(1)}% today">
          <b>${t.signal ? "🛒 " : ""}${esc(t.symbol)}</b><span>${t.rating} · ${t.chg_1d >= 0 ? "+" : ""}${(t.chg_1d * 100).toFixed(1)}%</span></button>`; }).join("")}
    </div></div>`).join("")}<div id="tip"></div>`;
  document.querySelectorAll(".tile").forEach(b => b.onclick = () => showTile(b.dataset.s));
}
function showTile(sym) {
  const t = HEAT.tiles.find(x => x.symbol === sym);
  document.querySelectorAll(".tile").forEach(b => b.classList.toggle("sel", b.dataset.s === sym));
  const tile = document.querySelector(`.tile[data-s="${CSS.escape(sym)}"]`);
  tile.closest(".sector").after($("#tip"));   // show details right under the tapped sector
  const py = t.past_year;
  $("#tip").innerHTML = `<div class="card" style="margin-top:0">
    <div class="label">${t.signal ? "🛒 Meets every dip rule" : t.uptrend ? "📈 In an uptrend · waiting for a dip" : "🚫 Not in an uptrend"}</div>
    <div class="sym" style="font-size:32px">${esc(t.symbol)} <span style="font-size:20px;font-weight:600">${t.rating}</span></div>
    <div class="name">${esc(t.name)} · ${esc(t.sector)} · ${money(t.close)}</div>
    <div class="section">${meters({"🔻 Dip / oversold": t.parts.dip, "📈 Trend": t.parts.trend, "💪 Rel. strength": t.parts.rs})}</div>
    <div class="stats"><span>RSI(2) ${t.rsi2}</span><span>${pct(t.dip)} off 20-day high</span></div>
    ${t.status ? `<div class="sub" style="margin-bottom:4px">${esc(t.status)}</div>` : ""}
    <div class="sub">${py ? `Past year: ${py.trades} dip trade${py.trades === 1 ? "" : "s"} · ${pct(py.win_rate)} won · avg ${(py.avg_ret * 100).toFixed(1)}% each` : "No qualifying dips in the past year"}</div>
  </div>`;
}

// ---------- dip backtest ----------
let DIPS = null, STYLE = "target";
function curveSvg(curve) {
  if (!curve || curve.length < 2) return "";
  const ys = curve.map(p => p.equity), lo = Math.min(1, ...ys), hi = Math.max(1, ...ys);
  const W = 560, H = 120, x = i => i / (curve.length - 1) * W, y = v => H - 8 - (v - lo) / (hi - lo || 1) * (H - 16);
  const pts = curve.map((p, i) => `${x(i).toFixed(1)},${y(p.equity).toFixed(1)}`).join(" ");
  return `<svg class="curve" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <line x1="0" x2="${W}" y1="${y(1)}" y2="${y(1)}" stroke="var(--line)" stroke-dasharray="3 3"/>
    <polyline points="${pts}" fill="none" stroke="var(--blue)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>
    <div class="legend">Closed-trade equity, 10 equal slots · dashed = starting value</div>`;
}
function renderDips(d) {
  DIPS = d;
  if (!d || d.empty) { $("#dips").innerHTML = `<div class="card"><div class="label">🛒 Dip-buy backtest</div><p class="sub">Run <code>python -m swing dips</code> to see how every qualifying dip played out.</p></div>`; return; }
  const st = d.styles[STYLE], y = st.past_year, r = st.random_uptrend_past_year, all = st.since_2015, pf = st.portfolio_past_year;
  const f = x => x == null ? "–" : `${x >= 0 ? "+" : ""}${(x * 100).toFixed(2)}%`;
  const best = [...st.per_ticker].filter(p => p.trades >= 2).sort((a, b) => b.total - a.total);
  $("#dips").innerHTML = `<div class="card">
    <div class="label">🛒 Dip-buy backtest · past 12 months</div>
    <div class="sub" style="margin-top:6px">${esc(d.rules.uptrend)} · ${esc(d.rules.dip)} · buy ${esc(d.rules.entry)} · stop ${esc(d.rules.stop)}</div>
    <div class="seg"><button data-st="target" class="${STYLE === "target" ? "on" : ""}">🎯 Exit at prior high</button><button data-st="revert" class="${STYLE === "revert" ? "on" : ""}">↩️ Exit on bounce</button></div>
    <div class="sub" style="margin-top:6px">${esc(d.rules.exits[STYLE])}</div>
    <div class="kpis">
      <div><small>Trades</small><b>${y.trades}</b><small>${(y.avg_days || 0).toFixed(1)} days avg</small></div>
      <div><small>Win rate</small><b>${pct(y.win_rate)}</b><small>random: ${pct(r.win_rate)}</small></div>
      <div><small>Avg per trade</small><b class="${y.avg_ret >= 0 ? "pos" : "neg"}">${f(y.avg_ret)}</b><small>random: ${f(r.avg_ret)}</small></div>
      <div><small>10-slot book</small><b class="${pf.total_return >= 0 ? "pos" : "neg"}">${f(pf.total_return)}</b><small>SPY: ${f(d.spy_1y)}</small></div>
      <div><small>Profit factor</small><b>${y.profit_factor ? y.profit_factor.toFixed(2) : "–"}</b><small>wins $ / losses $</small></div>
      <div><small>Max drawdown</small><b class="neg">${f(pf.max_drawdown_closed)}</b><small>closed trades</small></div>
    </div>
    ${curveSvg(pf.curve)}
    <div class="section"><h3>📅 Outcome mix</h3><p>✅ ${pct(y.hit_target)} hit the exit target · ❌ ${pct(y.stopped)} stopped/red · ⏳ ${pct(y.timed_out)} timed out</p>
      <p class="sub">Since 2015: ${all.trades} trades · ${pct(all.win_rate)} won · ${f(all.avg_ret)} avg (random uptrend days: ${f(st.random_uptrend_since_2015.avg_ret)})</p></div>
    ${best.length ? `<div class="section"><h3>🏆 Best & worst tickers (2+ trades)</h3><table><tr><th>Ticker</th><th>Trades</th><th>Won</th><th>Compounded</th></tr>
      ${[...best.slice(0, 5), ...best.slice(-5).reverse()].filter((v, i, a) => a.indexOf(v) === i).map(p => `<tr><td>${esc(p.symbol)}</td><td>${p.trades}</td><td>${pct(p.win_rate)}</td><td class="${p.total >= 0 ? "pos" : "neg"}">${f(p.total)}</td></tr>`).join("")}</table></div>` : ""}
    <details><summary>🧾 Recent dip trades</summary><table style="margin-top:8px"><tr><th>Ticker</th><th>Bought</th><th>Sold</th><th>Days</th><th>Return</th></tr>
      ${st.recent.slice(0, 25).map(t => `<tr><td>${esc(t.symbol)}</td><td>${t.entry_date.slice(5)} @ ${t.entry}</td><td>${t.exit_date.slice(5)} @ ${t.exit}</td><td>${t.days}</td><td class="${t.ret >= 0 ? "pos" : "neg"}">${f(t.ret)}</td></tr>`).join("")}</table></details>
  </div>`;
  document.querySelectorAll(".seg button").forEach(b => b.onclick = () => { STYLE = b.dataset.st; renderDips(DIPS); });
}

// ---------- active mega-cap trader (IBS) ----------
function renderActive(a) {
  if (!a || a.empty) { $("#active").innerHTML = ""; return; }
  const S = a.strategies, k = a.candidate, m = S[k], L = a.live;
  const f = x => x == null ? "–" : `${x >= 0 ? "+" : ""}${(x * 100).toFixed(1)}%`;
  const row = (n, lab) => { const x = S[n]; return `<tr><td>${lab}</td><td>${f(x.full.cagr)}</td><td>${f(x.in_sample.cagr)}</td><td>${f(x.out_sample.cagr)}</td><td>${x.full.sharpe.toFixed(2)}</td><td>${f(x.full.max_dd)}</td></tr>`; };
  const yrs = Object.keys(m.years);
  const buys = L.signals.filter(x => x.buy), held = L.positions;
  const CHECK = {oos_cagr_beats_spy: "2021–26 return above SPY", oos_sharpe_beats_spy: "2021–26 risk-adjusted return (Sharpe) above SPY",
    oos_beats_holding_same_stocks: "beats simply holding the same stocks", beats_random_timing: "beats random timing",
    in_sample_also_beats_spy: "2016–20 return also above SPY", neighbours_beat_spy_oos: "nearby settings also beat SPY"};
  const failed = Object.entries(m.checks).filter(([q, v]) => !v).map(([q]) => CHECK[q] || q);
  $("#active").innerHTML = `<div class="card">
    <div class="label">⚡ Active mega-cap trader · Internal Bar Strength</div>
    <div class="sub" style="margin-top:6px">Top 30 most-traded stocks · buy at the close when it finishes in the bottom 20% of its day's range and is above its 200-day · sell on the first close above the prior day's high (max 10 days) · 10 slots</div>
    <div class="kpis">
      <div><small>Return / yr</small><b class="pos">${f(m.full.cagr)}</b><small>SPY ${f(S.spy.full.cagr)}</small></div>
      <div><small>Worst drop</small><b class="neg">${f(m.full.max_dd)}</b><small>SPY ${f(S.spy.full.max_dd)}</small></div>
      <div><small>Win rate</small><b>${pct(m.win_rate)}</b><small>${Math.round(m.trades_per_year)} trades / yr</small></div>
    </div>
    <div class="section"><div style="overflow-x:auto"><table><tr><th></th><th>2016–26</th><th>2016–20</th><th>2021–26</th><th>Sharpe</th><th>Max DD</th></tr>
      ${row(k, "⚡ IBS")}${row("spy", "SPY")}${row("qqq", "QQQ")}${row("equal_weight", "Hold same 30 stocks")}${row("random_same_exits", "Random buys, same exits")}${row("rsi2", "RSI(2) (Connors)")}${row("reversal", "Weekly reversal")}</table></div></div>
    <div class="section"><h3>📅 Year by year vs SPY</h3><div class="chips">${yrs.map(y => { const d = m.years[y] - S.spy.years[y];
      return `<span title="IBS ${f(m.years[y])} · SPY ${f(S.spy.years[y])}">${y} <b class="${d >= 0 ? "pos" : "neg"}">${d >= 0 ? "▲" : "▼"} ${f(m.years[y])}</b></span>`; }).join("")}</div>
      <p class="sub" style="margin-top:6px">Beat SPY in ${yrs.filter(y => m.years[y] > S.spy.years[y]).length} of ${yrs.length} years: the lead comes mostly from volatile years.</p></div>
    <div class="section"><h3>🟢 Buy signals at ${L.asof} close</h3>${buys.length ? `<div class="chips">${buys.map(x => `<span>${esc(x.symbol)} · IBS ${x.ibs}</span>`).join("")}</div>` : `<p class="sub">None today.</p>`}</div>
    ${held.length ? `<div class="section"><h3>📒 Model book (open positions)</h3><table><tr><th>Ticker</th><th>Since</th><th>P/L</th><th>Sell if close &gt;</th></tr>
      ${held.map(h => `<tr><td>${esc(h.symbol)}</td><td>${h.since.slice(5)}</td><td class="${h.pnl >= 0 ? "pos" : "neg"}">${f(h.pnl)}</td><td>${money(h.sell_if_close_above)}</td></tr>`).join("")}</table></div>` : ""}
    <div class="section"><h3>⚠️ Honest caveats</h3><ul>
      <li>Didn't pass every pre-set check: ${esc(failed.join(", ") || "none")}.</li>
      <li>Very cost-sensitive: at 0.15% per side instead of 0.05%, returns fall to ${f(S.ibs_cost_15bp.full.cagr)}/yr.</li>
      <li>Needs end-of-day discipline (market-on-close orders); buying at the next open instead returned ${f(S.ibs_next_open.full.cagr)}/yr.</li>
      <li>Backtests include delisted stocks where available, but still can't capture every real-world friction.</li></ul></div>
  </div>`;
}

// ---------- research: published strategies vs SPY ----------
const RS = [["spy", "SPY (buy & hold)", "var(--text)"], ["jt_mom", "12-1 momentum (Jegadeesh-Titman)", "#2a78d6"],
            ["clenow", "Stocks on the Move (Clenow)", "#eb6834"], ["gem", "Dual momentum (Antonacci)", "#1baf7a"],
            ["faber", "10-month trend (Faber)", "#e87ba4"]];
function renderResearch(r) {
  if (!r || r.empty) { $("#research").innerHTML = ""; return; }
  const S = r.strategies, f = x => `${x >= 0 ? "+" : ""}${(x * 100).toFixed(1)}%`;
  const rows = [...RS.map(x => x[0]), "equal_weight"].map(k => { const m = S[k];
    const name = k === "equal_weight" ? "Equal-weight same universe" : RS.find(x => x[0] === k)[1];
    return `<tr><td>${name}${m.passes ? " ✅" : ""}</td><td>${f(m.cagr)}</td><td>${m.sharpe.toFixed(2)}</td><td>${f(m.max_dd)}</td><td>${m.beta.toFixed(2)}</td><td>${k === "spy" ? "–" : f(m.alpha)}</td><td>${k === "spy" ? "–" : pct(m.win_36m)}</td></tr>`; }).join("");
  const checks = ["jt_mom", "clenow", "gem", "faber"].map(k => {
    const c = S[k].checks, lab = {cagr_beats_spy: "return > SPY", sharpe_beats_spy: "Sharpe > SPY", beats_equal_weight: "> equal-weight",
      wins_60pct_rolling_36m: "wins ≥60% of 3-yr windows", neighbours_beat_spy: "robust to settings"};
    return `<div class="row"><span>${RS.find(x => x[0] === k)[1]}</span><span style="text-align:right">${Object.entries(c).map(([q, v]) => `<span class="${v ? "ok" : "no"}" title="${lab[q]}">${v ? "✓" : "✗"}</span>`).join(" ")}</span></div>`; }).join("");
  const live = r.live, lname = RS.find(x => x[0] === live.strategy)[1];
  $("#research").innerHTML = `<div class="card">
    <div class="label">📚 Published strategies vs SPY · ${r.start.slice(0, 4)}–${r.end.slice(0, 4)}</div>
    <div class="sub" style="margin-top:6px">Growth of $10,000 (hover) · rules as published · trade next open · 0.10% cost · delisted stocks included where available</div>
    <div class="rs-chart"><svg id="rsSvg"></svg><div class="rs-tip" id="rsTip"></div></div>
    <div class="keys">${RS.map(([k, n, c]) => `<span><i style="background:${c}"></i>${n}</span>`).join("")}</div>
    <div class="section"><div style="overflow-x:auto"><table><tr><th>Strategy</th><th>CAGR</th><th>Sharpe</th><th>Max DD</th><th>Beta</th><th>Alpha</th><th>Beats SPY (3-yr)</th></tr>${rows}</table></div>
      <p class="sub" style="margin-top:6px">Alpha = return left after accounting for how much market risk (beta) was taken.</p></div>
    <div class="section"><h3>🧪 Pre-registered test (all 5 must pass)</h3>${checks}
      <p class="sub">return > SPY · Sharpe > SPY · beats equal-weight · wins ≥60% of 3-yr windows · nearby settings also beat SPY</p></div>
    <div class="section"><h3>${r.applied ? "✅ Applied" : "🚫 Nothing passed — closest candidate shown, not applied"}: ${lname}</h3>
      <p class="sub">Current portfolio from ${live.last_rebalance} · rebalances at each month end · ${live.holdings.length} positions</p>
      <div class="chips">${live.holdings.map(h => `<span>${esc(h.symbol)} ${(h.weight * 100).toFixed(1)}%</span>`).join("")}</div></div>
  </div>`;
  drawResearch(S);
}
function drawResearch(S) {
  const svg = $("#rsSvg"), W = svg.clientWidth || 560, H = 190, P = 6;
  const dates = S.spy.curve.map(p => p.d);
  const series = RS.map(([k, n, c]) => ({k, n, c, v: S[k].curve.map(p => Math.log(p.v))}));
  const all = series.flatMap(s => s.v), lo = Math.min(...all), hi = Math.max(...all);
  const x = i => P + i / (dates.length - 1) * (W - 2 * P), y = v => H - P - (v - lo) / (hi - lo) * (H - 2 * P);
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.innerHTML = `<line x1="${P}" x2="${W - P}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)" stroke-dasharray="3 3"/>` +
    series.map(s => `<polyline points="${s.v.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ")}" fill="none" stroke="${s.c}" stroke-width="${s.k === "spy" ? 2.5 : 2}"/>`).join("") +
    `<line id="rsX" y1="${P}" y2="${H - P}" stroke="var(--muted)" stroke-width="1" visibility="hidden"/>`;
  const tip = $("#rsTip");
  svg.onpointermove = e => {
    const b = svg.getBoundingClientRect(), i = Math.max(0, Math.min(dates.length - 1, Math.round((e.clientX - b.left - P) / (b.width - 2 * P) * (dates.length - 1))));
    const X = $("#rsX"); X.setAttribute("x1", x(i)); X.setAttribute("x2", x(i)); X.setAttribute("visibility", "visible");
    tip.style.display = "block"; tip.style.left = `${Math.min(b.width - 190, Math.max(0, e.clientX - b.left + 10))}px`;
    tip.innerHTML = `<b>${dates[i]}</b><br>` + series.map(s => `<span style="color:${s.c}">●</span> ${s.n.split(" (")[0]}: $${(Math.exp(s.v[i]) * 10000).toLocaleString(undefined, {maximumFractionDigits: 0})}`).join("<br>");
  };
  svg.onpointerleave = () => { tip.style.display = "none"; $("#rsX").setAttribute("visibility", "hidden"); };
}

async function load() {
  const [l, h, d, r, a] = await Promise.all(["/api/latest", "/api/heatmap", "/api/dips", "/api/research", "/api/active"].map(u => fetch(u).then(r => r.json())));
  render(l); renderHeat(h); renderDips(d); renderResearch(r); renderActive(a);
}

async function poll() {
  const s = await (await fetch("/api/status")).json();
  $("#log").textContent = s.error ? `❌ ${s.error}` : (s.log.slice(-1)[0] || "");
  $("#scan").disabled = s.running;
  if (s.running) setTimeout(poll, 1500); else load();
}

$("#scan").onclick = async () => { await fetch("/api/scan", {method: "POST"}); poll(); };

async function paper(p) {
  if (!confirm(`Place a PAPER bracket order for ${p.symbol}? (Alpaca paper account)`)) return;
  const r = await (await fetch("/api/paper", {method: "POST", body: JSON.stringify(p)})).json();
  alert(r.error ? `❌ ${r.error}` : `✅ ${r.qty} shares · ${r.status}`);
}

load(); poll();
</script>
